# Simulation and rendering only (runs as a separate worker process; no habitat-sim build supports Python 3.10).
#   conda env create -f environment/habitat_render.yml
name: habitat_render
channels:
  - aihabitat
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - habitat-sim=0.3.3
  - headless
  - withbullet
  - pip
  - pip:
      - numpy==1.26.4
      - numpy-quaternion==2023.0.4
      - numba==0.60.0
      - pillow==10.4.0
      - imageio==2.37.0
      - imageio-ffmpeg==0.6.0
